name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jobtracker
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        run: bash ./mvnw clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/jobtracker
          DB_USERNAME: jobtracker
          DB_PASSWORD: jobtracker

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Build and Validation
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start application containers
        run: docker compose up -d

      - name: Verify backend health
        run: |
          curl --fail --retry 15 --retry-delay 5 \
            --retry-all-errors --max-time 10 \
            http://localhost:8080/actuator/health

      - name: Verify frontend
        run: curl --fail http://localhost:4200

      - name: Verify API through Nginx
        run: curl --fail http://localhost:4200/api/applications

      - name: Display container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application containers
        if: always()
        run: docker compose down -v