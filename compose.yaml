services:
  postgres:
    image: postgres:17
    container_name: jobtracker-postgres
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobtracker -d jobtracker" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: jobtracker-backend:dev
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobtracker
      DB_USERNAME: jobtracker
      DB_PASSWORD: jobtracker
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: jobtracker-frontend:dev
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: